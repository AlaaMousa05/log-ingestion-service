services:
  postgres:
    image: postgres:18
    container_name: log-ingestion-postgres
    environment:
      POSTGRES_DB: log_ingestion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d log_ingestion"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: log-ingestion-app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/log_ingestion
      PORT: 8080
      RETENTION_DAYS: 30
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx drizzle-kit migrate && node dist/index.js"

  test:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/log_ingestion
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm ci && npx vitest run"

volumes:
  postgres_data:
