services:
  postgres:
    image: postgres:18
    container_name: log-ingestion-postgres
    environment:
      POSTGRES_DB: log_ingestion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d log_ingestion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
