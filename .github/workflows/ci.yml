name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: log_ingestion
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d log_ingestion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/log_ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:migrate
      - run: npm test
      - run: docker compose up --build -d
      - run: |
          for _ in {1..30}; do
            curl --fail http://localhost:8080/health && exit 0
            sleep 2
          done
          exit 1
      - run: bash scripts/audit-run.sh
      - if: always()
        run: docker compose down -v
